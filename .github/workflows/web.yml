name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  web-tests:
    name: Rule tests and accessibility audit
    # Pinned: ubuntu-latest is now 26.04, which Playwright 1.56.1 does not support.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tee "$GITHUB_WORKSPACE/pw-install.log"
      - name: Surface Chromium install failure
        if: failure()
        run: |
          grep -i -E "error|fail|E: |not found" "$GITHUB_WORKSPACE/pw-install.log" | head -40 | sed 's/^/::error::/' || true
          tail -20 "$GITHUB_WORKSPACE/pw-install.log" | sed 's/^/::error::/' || true
      - name: Run tests and accessibility audit
        run: npm test
        env:
          CI: "true"
