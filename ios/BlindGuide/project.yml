# XcodeGen spec. Generates BlindGuide.xcodeproj from this file.
# Install: brew install xcodegen   Generate: cd ios/BlindGuide && xcodegen generate
name: BlindGuide
options:
  bundleIdPrefix: org.blindguide
  deploymentTarget:
    iOS: "17.0"
packages:
  BlindGuideCore:
    path: ../BlindGuideCore
targets:
  BlindGuide:
    type: application
    platform: iOS
    sources:
      - BlindGuide
    dependencies:
      - package: BlindGuideCore
        product: BlindGuideCore
    info:
      path: BlindGuide/Info.plist
      properties:
        CFBundleDisplayName: BlindGuide
        UILaunchScreen: {}
        NSCameraUsageDescription: BlindGuide uses the camera to describe what is in front of you. Video is processed on your phone and is not stored.
        NSMicrophoneUsageDescription: BlindGuide listens for your voice commands.
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
